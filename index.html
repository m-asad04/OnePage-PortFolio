<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Pager - Muhammad Asad</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- React & Babel CDNs (Direct browser execution) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-sky-100 selection:text-sky-800">
  <div id="root"></div>

  <!-- Load Split React Components -->
  <script type="text/babel" src="js/Navbar.js"></script>
  <script type="text/babel" src="js/Hero.js"></script>
  <script type="text/babel" src="js/Portfolio.js"></script>
  <script type="text/babel" src="js/Services.js"></script>
  <script type="text/babel" src="js/About.js"></script>
  <script type="text/babel" src="js/Contact.js"></script>
  <script type="text/babel" src="js/Footer.js"></script>
  <script type="text/babel" src="js/App.js"></script>
</body>
</html>
