<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Pager - Muhammad Asad Portfolio</title>

  <!-- Google Fonts: Montserrat & Open Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['Montserrat', 'sans-serif'],
            body: ['Open Sans', 'sans-serif'],
          },
          colors: {
            theme: {
              accent: '#00adb5',
              accentHover: '#008b92',
              dark: '#222831',
              light: '#f8fafc',
              gray: '#393e46'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN (Runs React directly in browser without npm/terminal) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Open Sans', sans-serif;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Montserrat', sans-serif;
    }
  </style>
</head>
<body class="bg-white text-slate-700 antialiased selection:bg-[#00adb5] selection:text-white">
  <div id="root"></div>

  <!-- Modular React Components -->
  <script type="text/babel" src="js/Navbar.js"></script>
  <script type="text/babel" src="js/Hero.js"></script>
  <script type="text/babel" src="js/Portfolio.js"></script>
  <script type="text/babel" src="js/Services.js"></script>
  <script type="text/babel" src="js/About.js"></script>
  <script type="text/babel" src="js/Contact.js"></script>
  <script type="text/babel" src="js/Footer.js"></script>
  <script type="text/babel" src="js/App.js"></script>
</body>
</html>
